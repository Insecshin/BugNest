spring:
  application:
    name: bugnest
  datasource:
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2
        socketTimeout: 2
        cancelSignalTimeout: 1
  jdbc:
    template:
      query-timeout: 2s
  session:
    timeout: 30m
    redis:
      namespace: bugnest:sessions
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s

bugnest:
  security:
    rate-limit:
      hmac-key: ${BUGNEST_RATE_LIMIT_HMAC_KEY}
      trusted-proxies: ${BUGNEST_TRUSTED_PROXIES:}
